name: publish-otto-widget

# Publishes @tesserix/otto-widget to GitHub Packages. Consumers in other
# Tesserix repos (mark8ly, fanzone-web, homechef-web, stockpilot-frontend,
# gameverse-shell, tesserix-horoscope-frontend, scrapper-web) install from
# https://npm.pkg.github.com with the standard prod-ghcr-token NODE_AUTH_TOKEN
# pattern used everywhere else in the org.
#
# The package ships source TypeScript files (no build step). Consumers must
# add `@tesserix/otto-widget` to next.config `transpilePackages` so Next.js
# compiles the .tsx with the rest of the app — same pattern @tesserix/web
# would use if it weren't already pre-built.

on:
  push:
    branches: [main]
    paths:
      - "packages/otto-widget/package.json"
      - "packages/otto-widget/src/**"
      - ".github/workflows/publish-otto-widget.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none|patch|minor|major). 'none' publishes the version currently in package.json."
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@tesserix"

      - name: install
        working-directory: packages/otto-widget
        run: npm install --no-audit --no-fund

      - name: type-check
        working-directory: packages/otto-widget
        run: npm run check-types

      - name: bump version (if requested)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        working-directory: packages/otto-widget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: read version
        if: github.event_name != 'workflow_dispatch' || inputs.bump == 'none'
        working-directory: packages/otto-widget
        run: echo "NEW_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: skip if version already published
        id: gate
        run: |
          NAME=$(node -p "require('./packages/otto-widget/package.json').name")
          if npm view "$NAME@$NEW_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$NEW_VERSION already on GitHub Packages — skipping publish."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        if: steps.gate.outputs.already-published == 'false'
        working-directory: packages/otto-widget
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit version bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && steps.gate.outputs.already-published == 'false'
        run: |
          git add packages/otto-widget/package.json
          git commit -m "chore(otto-widget): release v$NEW_VERSION"
          git push
