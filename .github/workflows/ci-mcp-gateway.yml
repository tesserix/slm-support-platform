name: ci-mcp-gateway

# Build + push the shared mcp-gateway image. One image serves every
# tenant; the per-tenant Helm chart instantiation selects which tool
# group to expose via the MCP_TENANT env var.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
    paths:
      - "services/mcp-gateway/**"
      - ".github/workflows/ci-mcp-gateway.yml"
  pull_request:
    paths:
      - "services/mcp-gateway/**"
      - ".github/workflows/ci-mcp-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: build & push mcp-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: type-check (best effort, skipped if no deps installed)
        run: |
          python3 -m py_compile services/mcp-gateway/src/mcp_gateway/*.py

      - name: Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tesserix/slm-support-platform/mcp-gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/mcp-gateway
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
