name: ci-slm-router

on:
  push:
    branches: [main]
    paths:
      - "services/slm-router/**"
      - ".github/workflows/ci-slm-router.yml"
  pull_request:
    paths:
      - "services/slm-router/**"
      - ".github/workflows/ci-slm-router.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: tesserix/slm-support-platform/slm-router
  GO_VERSION: "1.26"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/slm-router/go.sum
      - name: go vet
        working-directory: services/slm-router
        run: go vet ./...
      - name: go test
        working-directory: services/slm-router
        run: go test -race -count=1 ./...

  build-and-push:
    name: build & push image
    runs-on: ubuntu-latest
    needs: test
    # Build + push on main pushes AND on manual dispatch. Skip on PR
    # builds (they only run tests).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: services/slm-router
          file: services/slm-router/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=slm-router
          cache-to: type=gha,mode=max,scope=slm-router
