[project]
name = "mcp-gateway"
version = "0.1.0"
description = "FastMCP server exposing per-tenant tools for Otto"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<3.3",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
